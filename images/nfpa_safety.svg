<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1b0a" />
      <stop offset="60%" stop-color="#140e05" />
      <stop offset="100%" stop-color="#0a0702" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fff0aa" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)" />

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#goldBorder)" stroke-width="14" filter="url(#shadow)" />
  <circle cx="250" cy="250" r="202" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="6,6" opacity="0.8" />
  
  <!-- Text on Path (Arc) -->
  <path id="textArcTop" d="M 70 250 A 180 180 0 0 1 430 250" fill="none" />
  <text fill="#ffe27a" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      NFPA ELECTRICAL SAFETY
    </textPath>
  </text>

  <path id="textArcBottom" d="M 430 250 A 180 180 0 0 1 70 250" fill="none" />
  <text fill="#ffe27a" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="4">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      STANDARD 70 &amp; 79 COMPLIANT
    </textPath>
  </text>

  <!-- Shield in Center -->
  <path d="M 250 120 L 340 160 L 340 270 Q 340 350 250 390 Q 160 350 160 270 L 160 160 Z" 
        fill="url(#innerShield)" stroke="url(#goldBorder)" stroke-width="8" filter="url(#shadow)" />

  <!-- Inner Shield Trim -->
  <path d="M 250 140 L 320 175 L 320 265 Q 320 330 250 365 Q 180 330 180 265 L 180 175 Z" 
        fill="#181109" stroke="#f59e0b" stroke-width="2" opacity="0.9" />

  <!-- Lightning Bolt Symbol -->
  <path d="M 265 170 L 210 260 L 255 260 L 230 340 L 300 240 L 255 240 Z" 
        fill="url(#boltGrad)" stroke="#b45309" stroke-width="2" filter="url(#glow)" />

  <!-- Stars -->
  <polygon points="250,145 254,155 265,155 256,162 260,172 250,166 240,172 244,162 235,155 246,155" fill="#fef08a" />
</svg>
